services:
  - type: web
    name: weather-agent
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: AGENT_API_TOKEN
        sync: false
      - key: WEATHER_API_KEY
        sync: false
