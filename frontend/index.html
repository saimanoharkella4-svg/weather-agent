<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather Agent AI</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="background">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>
    
    <div class="glass-container">
        <header>
            <h1>Weather Agent</h1>
            <p>Your AI-powered meteorological assistant</p>
        </header>

        <div class="chat-window" id="chat-window">
            <div class="message system">
                Hello! Ask me about the weather in any city.
            </div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="e.g. What's the weather in London?" autocomplete="off" />
            <button id="send-btn">
                <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </div>
    </div>

    <script src="/static/script.js?v=2"></script>
</body>
</html>
