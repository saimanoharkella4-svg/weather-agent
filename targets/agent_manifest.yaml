agent_name: "weather-agent"
version: "1.0.0"
compliance_frameworks:
  - owasp_llm_2025
  - owasp_agentic_2025

sources:
  - type: repo
    path: "https://github.com/saimanoharkella4-svg/weather-agent"
  - type: openapi
    path: "./openapi.json"
  - type: yaml_inline
    runbooks_dir: "./runbooks"
    golden_dataset:
      path: "eval/golden.jsonl"
    runtime:
      endpoint: "http://localhost:8082/chat"
      protocol: http
      auth: { type: bearer, token_env: "AGENT_API_TOKEN" }
    capabilities:
      max_steps: 25
      context_budget_tokens: 8192
      tools:
        - chat
        - health
        - invoke_agent
        - weather_api_call
      destructive_tools:
        - chat
        - invoke_agent
      requires_hitl: true
    security:
      pii_fields: ["location"]
      allowed_data_regions: ["global", "us-east"]
      data_classification: ["PUBLIC"]
slos:
  p95_latency_ms: 5000
  max_cost_per_task_usd: 0.1
